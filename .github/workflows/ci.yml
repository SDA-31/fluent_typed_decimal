name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0
  CARGO_TARGET_DIR: ${{ github.workspace }}/target

defaults:
  run:
    shell: bash

jobs:
  test:
    name: Tests / ${{ matrix.os }} / Rust ${{ matrix.rust }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - os: ubuntu-latest
            rust: stable
          - os: ubuntu-latest
            rust: '1.95.0'
          - os: windows-latest
            rust: stable
          - os: macos-latest
            rust: stable
    env:
      RUSTUP_TOOLCHAIN: ${{ matrix.rust }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install Rust and upstream generator formatter
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component rustfmt
      - name: Resolve independent dependency graphs
        run: |
          rustc --version
          cargo generate-lockfile
          cargo generate-lockfile --manifest-path examples/typed/Cargo.toml
      - name: Test adapter and doctests
        run: |
          cargo test --locked --no-default-features
          cargo test --locked --all-features
      - name: Test generated String accessors and run examples
        run: |
          cargo test --locked --manifest-path examples/typed/Cargo.toml
          cargo run --locked --manifest-path examples/typed/Cargo.toml
          cargo run --locked --example fluent
          cargo run --locked --example numbers

  quality:
    name: Formatting, Clippy, docs and package
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      RUSTUP_TOOLCHAIN: stable
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install Rust tools
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - name: Check formatting
        run: |
          cargo fmt --all -- --check
          cargo fmt --manifest-path examples/typed/Cargo.toml --all -- --check
      - name: Resolve independent dependency graphs
        run: |
          cargo generate-lockfile
          cargo generate-lockfile --manifest-path examples/typed/Cargo.toml
      - name: Clippy
        run: |
          cargo clippy --locked --all-targets --all-features -- -D warnings
          cargo clippy --locked --manifest-path examples/typed/Cargo.toml --all-targets -- -D warnings
      - name: Build documentation in both feature modes
        run: |
          cargo doc --locked --no-deps --no-default-features
          cargo doc --locked --no-deps --all-features
      - name: Verify dependency boundary and archive
        run: |
          cargo tree --locked --edges normal,build --prefix none > "$CARGO_TARGET_DIR/dependencies.txt"
          if grep -E '^(fluent-typed|fluent_typed_codegen|bevy|bevy_fluent_typed) v' "$CARGO_TARGET_DIR/dependencies.txt"; then
            echo 'Translation or engine dependencies leaked into the Decimal adapter.' >&2
            exit 1
          fi
          cargo package --locked --list
          cargo package --locked
